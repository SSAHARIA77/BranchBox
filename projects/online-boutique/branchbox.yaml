# BranchBox project definition for Google Online Boutique.
#
# This is the only application-specific input BranchBox needs. To onboard a
# different application, write an equivalent file (and point the compose
# override at its baseline) — no BranchBox code changes are required. In
# Major Project-II this file is generated by the discovery module.

project: online-boutique

repository:
  # Inside the controller container. Replace with the team fork, e.g.
  # https://github.com/<org>/microservices-demo.git, to build from GitHub.
  url: file:///repos/microservices-demo
  baseRef: v0.10.7

runtime:
  composeProject: online-boutique
  network: branchbox-online-boutique

entry:
  service: frontend

limits:
  maxSandboxes: 10

# name: DNS name the other services dial; port: the port they dial;
# build.context: service source directory inside the repository.
services:
  - name: frontend
    port: 8080
    protocol: http
    build: { context: src/frontend }
  - name: checkoutservice
    port: 5050
    protocol: grpc
    build: { context: src/checkoutservice }
  - name: productcatalogservice
    port: 3550
    protocol: grpc
    build: { context: src/productcatalogservice }
  - name: currencyservice
    port: 7000
    protocol: grpc
    build: { context: src/currencyservice }
  - name: cartservice
    port: 7070
    protocol: grpc
    build: { context: src/cartservice/src }
  - name: recommendationservice
    port: 8080
    protocol: grpc
    build: { context: src/recommendationservice }
  - name: shippingservice
    port: 50051
    protocol: grpc
    build: { context: src/shippingservice }
  - name: paymentservice
    port: 50051
    protocol: grpc
    build: { context: src/paymentservice }
  - name: emailservice
    port: 5000
    protocol: grpc
    build: { context: src/emailservice }
  - name: adservice
    port: 9555
    protocol: grpc
    build: { context: src/adservice }
